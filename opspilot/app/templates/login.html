<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ app_name }} — Sign in</title>
<meta name="description" content="Sign in to BVTech OpsPilot — the managed IT command center and client portal by BVTech LLC. Monitoring, support, security and reporting in one place.">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/pulse.css?v={{ version }}">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a class="lockup" href="/">
      <img src="/static/img/mark.svg" alt="BVTech OpsPilot">
      <span class="wm"><b>BVTech</b> OpsPilot<span>MSP Command Center</span></span>
    </a>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Command center &amp; client portal</p>

    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@bvtech.org">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <div id="mfa-row" class="hidden">
      <label>Authenticator code</label>
      <input id="mfa" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" style="width:100%;margin-top:18px" onclick="doLogin()">Sign in</button>
    <div id="sso" class="hidden" style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:6px 0">
        <span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <div id="sso-btns" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="auth-links" id="authlink">New here? <a href="/signup">Request access →</a></div>
    <div class="auth-links" style="margin-top:2px"><a href="/" style="color:var(--muted)">← Choose a different login</a></div>
    <div class="foot">BVTech LLC · Managed IT &amp; Cybersecurity · <a href="mailto:help@bvtech.org" style="color:inherit">help@bvtech.org</a></div>
    <div class="foot">v{{ version }} · Encrypted · MFA-ready · Audit-logged</div>
  </div>
</div>
<script>
// Single sign-on buttons appear only for configured providers.
const AS=new URLSearchParams(location.search).get('as')||'';
(function(){
  const params=new URLSearchParams(location.search);
  // Tailor the page to the door the visitor came through.
  const doors={
    staff:{t:'BVTech Team sign in',s:'MSP command center'},
    client:{t:'Client Portal sign in',s:'Your security, devices &amp; support'},
    academy:{t:'Academy sign in',s:'Learn to hack &amp; defend — welcome back'}
  };
  if(doors[AS]){document.getElementById('title').innerHTML=doors[AS].t;document.getElementById('subtitle').innerHTML=doors[AS].s;}
  // "New here?" differs: the Academy is open self-signup; the rest request access.
  if(AS==='academy'){
    document.getElementById('authlink').innerHTML='New here? <a href="/join">Create a free account →</a>';
    document.getElementById('email').placeholder='you@anywhere.com';
  }
  if(params.get('oauth_error')){
    const m={no_account:(AS==='academy'?'No account yet — tap “Create a free account” below.':'That account isn’t linked to a BVTech login yet. If you’re staff, sign in with your @bvtech.org work account (or email + password below); otherwise ask your MSP to invite that address.'),
      sso_disabled:'Single sign-on is turned off. Sign in with your email and password below.',
      exchange_failed:'Microsoft/Google sign-in failed (the app’s client secret may be wrong or expired). Try again, or use email + password.',no_token:'Sign-in didn’t complete — please try again.'};
    setTimeout(()=>{const e=document.getElementById('err');if(e)e.textContent=m[params.get('oauth_error')]||'Sign-in failed.';},50);
  }
  fetch('/api/oauth/providers').then(r=>r.ok?r.json():{providers:[]}).then(j=>{
    if(!j.sso_allowed||!(j.providers||[]).length)return;
    document.getElementById('sso').classList.remove('hidden');
    // Academy door = one-click SSO signup (join=1 provisions an isolated learner).
    const join=AS==='academy'?'?join=1':'';
    const verb=AS==='academy'?'Continue with':'Sign in with';
    // Carry a safe ?next= through the SSO round-trip so, e.g., an OAuth connect
    // that bounced here (session expired) lands back on the provider's approve
    // screen after sign-in instead of dumping the operator on the dashboard.
    const nx=new URLSearchParams(location.search).get('next')||'';
    const nq=(nx && /^\/(?!\/)/.test(nx) && AS!=='academy')?((join?'&':'?')+'next='+encodeURIComponent(nx)):'';
    document.getElementById('sso-btns').innerHTML=(j.providers||[]).map(p=>
      `<a class="btn ghost" style="width:100%;text-align:center;text-decoration:none" href="/api/oauth/${p.key}/login${join}${nq}">${verb} ${p.name}</a>`).join('');
  }).catch(()=>{});
})();
async function doLogin(){
  const err=document.getElementById('err');err.textContent='';
  const body={
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value,
    mfa_code:document.getElementById('mfa').value.trim()||null
  };
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){
    const d=await r.json();
    const nxt=new URLSearchParams(location.search).get('next');
    if(nxt && /^\/(?!\/)/.test(nxt)){ location.href=nxt; return; }
    // The server decides home: /dashboard (staff), /portal (client), /academy (student).
    location.href = d.home || ((d.role==='client_admin'||d.role==='client_viewer') ? '/portal' : '/dashboard');
    return;
  }
  const d=await r.json().catch(()=>({detail:'Error'}));
  if(d.detail==='MFA code required'){
    document.getElementById('mfa-row').classList.remove('hidden');
    err.textContent='Enter your authenticator code.';
  }else{
    err.textContent=d.detail||'Sign in failed';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
<script src="/static/js/brand.js?v={{ version }}"></script>
</body>
</html>
