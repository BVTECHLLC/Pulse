<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ app_name }} — Partner View</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/pulse.css?v={{ version }}">
<style>
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .brand .dot{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#22c55e)}
  .scopebar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,#22c55e 12%,transparent);
    border:1px solid color-mix(in srgb,#22c55e 40%,var(--line));border-radius:12px;padding:10px 14px;
    font-size:13px;color:var(--ink);margin-bottom:16px}
  .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent,#3b82f6) 16%,transparent),
    color-mix(in srgb,#22c55e 9%,transparent));border:1px solid var(--line);border-radius:16px;
    padding:20px 22px;margin-bottom:16px}
  .hero h2{margin:0 0 4px;font-size:22px}
  .hero p{margin:0;color:var(--muted,#9fb0c9)}
  .cols{display:grid;grid-template-columns:260px 1fr;gap:16px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel,#121a2b);border:1px solid var(--line);border-radius:14px;padding:12px}
  .lead{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .lead:hover{background:color-mix(in srgb,var(--accent,#3b82f6) 10%,transparent)}
  .lead.active{background:color-mix(in srgb,var(--accent,#3b82f6) 18%,transparent);border-color:var(--line)}
  .lead b{font-size:14px}
  .lead small{color:var(--muted,#9fb0c9);font-size:12px;word-break:break-all}
  .msg{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
  .msg:hover{background:color-mix(in srgb,var(--accent,#3b82f6) 7%,transparent)}
  .msg .s{font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .msg .s .d{font-size:12px;color:var(--muted,#9fb0c9);white-space:nowrap}
  .msg .m{font-size:12px;color:var(--muted,#9fb0c9);margin:2px 0}
  .msg .p{font-size:13px;color:var(--ink);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted,#9fb0c9)}
  .unread{color:var(--accent,#3b82f6)}
  .empty{padding:30px;text-align:center;color:var(--muted,#9fb0c9)}
  .btn{background:var(--accent,#3b82f6);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer}
  .ov{position:fixed;inset:0;background:rgba(3,8,20,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .ov.open{display:flex}
  .sheet{background:var(--panel,#0f1626);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
  .sheet .h{padding:16px 18px;border-bottom:1px solid var(--line)}
  .sheet .h h3{margin:0 0 4px;font-size:18px}
  .sheet .h .meta{font-size:12px;color:var(--muted,#9fb0c9)}
  .sheet iframe{border:0;width:100%;flex:1;min-height:320px;background:#fff;border-radius:0 0 16px 16px}
  .sheet .foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> BVTech · Partner View</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="who" class="pill"></span>
      <button class="ghost" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="scopebar">🔒 <b>Read-only &amp; scoped.</b>&nbsp;You can see emails to and from your approved leads only — nothing else in the mailbox is accessible.</div>

  <div class="hero">
    <h2 id="hi">Welcome</h2>
    <p id="sub">Loading your leads…</p>
  </div>

  <div class="cols">
    <div class="card" id="leadcard">
      <div style="font-weight:700;margin:4px 6px 8px">Your leads</div>
      <div class="lead active" data-email="" onclick="pick(this,'')"><b>All leads</b><small>Everything you're allowed to see</small></div>
      <div id="leads"></div>
    </div>
    <div class="card" style="padding:0">
      <div id="msgs"><div class="empty">Select a lead to see the conversation.</div></div>
    </div>
  </div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)close_()">
  <div class="sheet">
    <div class="h"><h3 id="ov-sub"></h3><div class="meta" id="ov-meta"></div></div>
    <iframe id="ov-body" sandbox referrerpolicy="no-referrer"></iframe>
    <div class="foot"><button class="ghost" onclick="close_()">Close</button></div>
  </div>
</div>

<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ago(iso){if(!iso)return '';const d=new Date(iso),s=(Date.now()-d)/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';
  if(s<86400*7)return Math.round(s/86400)+'d ago';return d.toLocaleDateString();}
async function api(p){const r=await fetch(p);if(r.status===401){location.href='/login?as=helper';return null;}if(!r.ok)return null;return r.json();}
async function logout(){try{await fetch('/api/auth/logout',{method:'POST'});}catch(e){}location.href='/login?as=helper';}
let ME=null, CUR='';

function pick(el,email){
  document.querySelectorAll('.lead').forEach(x=>x.classList.remove('active'));
  el.classList.add('active'); CUR=email; loadMsgs(email);
}
async function loadMsgs(email){
  const box=document.getElementById('msgs');
  box.innerHTML='<div class="empty">Loading…</div>';
  const d=await api('/api/guest/messages'+(email?('?lead='+encodeURIComponent(email)):''));
  if(!d){box.innerHTML='<div class="empty">Could not load mail right now.</div>';return;}
  const ms=d.messages||[];
  if(!ms.length){box.innerHTML='<div class="empty">No emails yet'+(email?' with this lead':'')+'. Nothing to show — which is itself an answer. 🙂</div>';return;}
  box.innerHTML=ms.map(m=>{
    const from=(m.from&&(m.from.name||m.from.address))||'?';
    const to=(m.to||[]).map(t=>t.name||t.address).join(', ');
    return '<div class="msg" onclick="openMsg(\''+esc(m.id).replace(/'/g,"\\'")+'\')">'
      +'<div class="s"><span>'+(m.is_read?'':'<span class="unread">● </span>')+esc(m.subject)+'</span><span class="d">'+ago(m.received)+'</span></div>'
      +'<div class="m">from <b>'+esc(from)+'</b>'+(to?(' · to '+esc(to)):'')+(m.has_attachments?' · 📎':'')+'</div>'
      +(m.preview?('<div class="p">'+esc(m.preview)+'</div>'):'')+'</div>';
  }).join('');
}
async function openMsg(id){
  const d=await api('/api/guest/messages/'+encodeURIComponent(id));
  if(!d)return;
  document.getElementById('ov-sub').textContent=d.subject||'(no subject)';
  const from=(d.from&&(d.from.name||d.from.address))||'?';
  const to=(d.to||[]).map(t=>t.name||t.address).join(', ');
  const cc=(d.cc||[]).map(t=>t.name||t.address).join(', ');
  document.getElementById('ov-meta').textContent='From '+from+' · To '+to+(cc?(' · Cc '+cc):'')+' · '+(d.received?new Date(d.received).toLocaleString():'');
  const ifr=document.getElementById('ov-body');
  if(d.body_content!=null){
    ifr.srcdoc = (d.body_type==='html') ? d.body_content
      : '<pre style="white-space:pre-wrap;font:14px/1.5 system-ui;padding:14px">'+esc(d.body_content)+'</pre>';
  } else {
    ifr.srcdoc='<p style="font:14px system-ui;padding:14px;color:#555">Message body is hidden for this view.</p>';
  }
  document.getElementById('ov').classList.add('open');
}
function close_(){document.getElementById('ov').classList.remove('open');document.getElementById('ov-body').srcdoc='';}

(async function(){
  ME=await api('/api/guest/me'); if(!ME){location.href='/login?as=helper';return;}
  document.getElementById('who').textContent=ME.email;
  document.getElementById('hi').textContent='Welcome, '+(ME.name||'partner');
  document.getElementById('sub').textContent='You can see emails to and from '+ME.lead_count+' approved lead'+(ME.lead_count===1?'':'s')+'. Click one to see what\u2019s happening.';
  document.getElementById('leads').innerHTML=(ME.leads||[]).map(l=>
    '<div class="lead" data-email="'+esc(l.email)+'" onclick="pick(this,\''+esc(l.email).replace(/'/g,"\\'")+'\')">'
    +'<b>'+esc(l.label)+'</b><small>'+esc(l.email)+'</small></div>').join('')
    ||'<div class="empty" style="padding:14px">No leads assigned yet.</div>';
  loadMsgs('');
})();
</script>
<script src="/static/js/brand.js?v={{ version }}"></script>
</body>
</html>
