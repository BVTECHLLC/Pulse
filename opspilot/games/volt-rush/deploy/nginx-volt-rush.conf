# Place these location blocks INSIDE the EXISTING HTTPS server { } for portal.bvtech.org.
# Do not replace your current server block or its existing / application configuration.
# The Node server listens only on 127.0.0.1:3108.

location = /kart {
    return 301 /kart/;
}

location ^~ /kart/ws {
    proxy_pass http://127.0.0.1:3108;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

location ^~ /kart/ {
    proxy_pass http://127.0.0.1:3108;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
