<!--
  Daily Note to Autumn — a self-updating "miss you" note for autumnpolasek.com.

  HOW IT WORKS: this is a drop-in widget. Paste the <div> + <script> below into
  the memorial page (anywhere in the <body> where you want the note to appear).
  It picks a different note every day, seeded by the calendar date — no server,
  no cron, no deploy. It just quietly changes on its own, forever. If Pulse or
  the box are ever down, this keeps working; it lives entirely in the page.

  Written by Jordan Polasek, for Autumn. 🐾
-->
<div id="autumn-daily-note" aria-live="polite">
  <div class="adn-card">
    <div class="adn-eyebrow">A note to Autumn — <span class="adn-date"></span></div>
    <p class="adn-body"></p>
    <div class="adn-sign">— Daddy misses you, sweet girl 🤎</div>
  </div>
</div>

<style>
  #autumn-daily-note{max-width:640px;margin:2.5rem auto;padding:0 1rem;
    font-family:Georgia,'Times New Roman',serif}
  #autumn-daily-note .adn-card{background:linear-gradient(180deg,#fbf7f1,#f4ece1);
    border:1px solid #e6d9c6;border-radius:18px;padding:1.6rem 1.5rem;
    box-shadow:0 8px 26px rgba(120,90,60,.12);text-align:center}
  #autumn-daily-note .adn-eyebrow{font-size:.8rem;letter-spacing:.06em;
    text-transform:uppercase;color:#a9865f;margin-bottom:.7rem}
  #autumn-daily-note .adn-body{font-size:1.18rem;line-height:1.7;color:#4b3b2c;
    margin:0 0 1rem;font-style:italic}
  #autumn-daily-note .adn-sign{font-size:1rem;color:#7b6350}
  @media (prefers-color-scheme:dark){
    #autumn-daily-note .adn-card{background:linear-gradient(180deg,#2a241f,#211c18);
      border-color:#3d342b;box-shadow:0 8px 26px rgba(0,0,0,.4)}
    #autumn-daily-note .adn-body{color:#eaddcb}
    #autumn-daily-note .adn-eyebrow{color:#caa578}
    #autumn-daily-note .adn-sign{color:#c9b49d}
  }
</style>

<script>
(function () {
  // 60 notes — with a date seed this cycles about every two months, so the same
  // note never lands two days running. Written by Jordan Polasek, to Autumn.
  var NOTES = [
    "Good morning, sweet girl. “He heals the brokenhearted and binds up their wounds.” — Psalm 147:3",
    "Miss you today, Autumn. “Blessed are those who mourn, for they shall be comforted.” — Matthew 5:4",
    "Thinking of you, girl. “The LORD is near to the brokenhearted.” — Psalm 34:18",
    "Rest easy, sweet Autumn. “He will wipe away every tear from their eyes.” — Revelation 21:4",
    "You were such a good girl. “The righteous care for the needs of their animals.” — Proverbs 12:10",
    "Love you always. “For everything there is a season, and a time for every matter under heaven.” — Ecclesiastes 3:1",
    "Miss that sweet face. “He has made everything beautiful in its time.” — Ecclesiastes 3:11",
    "Sleep well, girl. “In peace I will both lie down and sleep; for you alone, O LORD, make me dwell in safety.” — Psalm 4:8",
    "Every sunrise is yours. “This is the day that the LORD has made; let us rejoice and be glad in it.” — Psalm 118:24",
    "You are safe now. “He will cover you with his feathers, and under his wings you will find refuge.” — Psalm 91:4",
    "Missing you, Autumn. “Weeping may tarry for the night, but joy comes with the morning.” — Psalm 30:5",
    "My sweet girl. “Man and beast you save, O LORD.” — Psalm 36:6",
    "Thinking of you always. “Ask the beasts, and they will teach you… In his hand is the life of every living thing.” — Job 12:7,10",
    "You were a gift, girl. “Every good gift and every perfect gift is from above.” — James 1:17",
    "Miss you every day. “His compassions never fail. They are new every morning.” — Lamentations 3:22–23",
    "Until we meet again. “In my Father’s house are many rooms.” — John 14:2",
    "God’s got you now. “The LORD will keep your going out and your coming in from this time forth and forevermore.” — Psalm 121:8",
    "Love you, sweet girl. “Nothing will be able to separate us from the love of God.” — Romans 8:39",
    "You made every day better. “Give thanks to the LORD, for he is good; his steadfast love endures forever.” — Psalm 107:1",
    "Rest now, Autumn. “Come to me, all who labor and are heavy laden, and I will give you rest.” — Matthew 11:28",
    "Miss our mornings, girl. “Satisfy us in the morning with your steadfast love.” — Psalm 90:14",
    "You are remembered. “Are not five sparrows sold for two pennies? And not one of them is forgotten before God.” — Luke 12:6",
    "Sweet dreams, girl. “He gives to his beloved sleep.” — Psalm 127:2",
    "The house misses you too. “Even the sparrow finds a home, and the swallow a nest for herself.” — Psalm 84:3",
    "Carrying you with me. “My flesh and my heart may fail, but God is the strength of my heart.” — Psalm 73:26",
    "Grateful for every day we had. “I will give thanks to the LORD with my whole heart.” — Psalm 9:1",
    "Missing your joy today. “You will fill me with joy in your presence.” — Psalm 16:11",
    "God saw every wag, girl. “The eyes of the LORD are in every place.” — Proverbs 15:3",
    "You were loved so much. “We love because he first loved us.” — 1 John 4:19",
    "Peace, sweet Autumn. “Peace I leave with you; my peace I give to you.” — John 14:27",
    "Hold on for me, girl. “He will renew your strength; you will soar on wings like eagles.” — Isaiah 40:31",
    "One day at a time. “Do not be anxious about tomorrow, for tomorrow will be anxious for itself.” — Matthew 6:34",
    "Look at the birds, girl — I do, and I think of you. “Your heavenly Father feeds them.” — Matthew 6:26",
    "You knew the way home. “He leads me beside still waters. He restores my soul.” — Psalm 23:2–3",
    "No more pain now, sweet girl. “Neither shall there be mourning, nor crying, nor pain anymore.” — Revelation 21:4",
    "God holds you. “Underneath are the everlasting arms.” — Deuteronomy 33:27",
    "Miss you, my shadow. “The LORD your God is with you wherever you go.” — Joshua 1:9",
    "You taught me gentleness. “Let your gentleness be evident to all.” — Philippians 4:5",
    "Still thankful for you. “Give thanks in all circumstances.” — 1 Thessalonians 5:18",
    "The grief is love, girl. “We do not grieve as others do who have no hope.” — 1 Thessalonians 4:13",
    "Every creature is His. “For every beast of the forest is mine… and all that moves in the field is mine.” — Psalm 50:10–11",
    "You were fearfully, wonderfully made. “I praise you, for I am fearfully and wonderfully made.” — Psalm 139:14",
    "It was all good, girl. “And God made the beasts of the earth… And God saw that it was good.” — Genesis 1:25",
    "A time to weep, a time to laugh — you gave me both. “A time to weep, and a time to laugh.” — Ecclesiastes 3:4",
    "My heart is lighter remembering you. “A glad heart makes a cheerful face.” — Proverbs 15:13",
    "Casting today’s missing on Him. “Cast all your anxiety on him because he cares for you.” — 1 Peter 5:7",
    "He knows, girl. “You have kept count of my tossings; put my tears in your bottle.” — Psalm 56:8",
    "Waiting on that morning. “Joy comes with the morning.” — Psalm 30:5",
    "You are not lost, just ahead. “I will see you again, and your hearts will rejoice.” — John 16:22",
    "Everything He made matters. “The LORD is good to all, and his mercy is over all that he has made.” — Psalm 145:9",
    "Trusting Him with you. “Trust in the LORD with all your heart.” — Proverbs 3:5",
    "The best is still coming. “Behold, I am making all things new.” — Revelation 21:5",
    "You were my comfort, girl. “Blessed be the God of all comfort, who comforts us in all our affliction.” — 2 Corinthians 1:3–4",
    "What is seen is temporary. “The things that are unseen are eternal.” — 2 Corinthians 4:18",
    "He gathers the gentle ones. “He will gather the lambs in his arms and carry them close to his heart.” — Isaiah 40:11",
    "Guarding my heart with you in it. “The peace of God will guard your hearts and your minds.” — Philippians 4:7",
    "Strength for today, girl. “The joy of the LORD is your strength.” — Nehemiah 8:10",
    "Hope doesn’t disappoint. “Hope does not put us to shame, because God’s love has been poured into our hearts.” — Romans 5:5",
    "All things together for good. “And we know that for those who love God all things work together for good.” — Romans 8:28",
    "Good night, sweet girl. “I lay down and slept; I woke again, for the LORD sustained me.” — Psalm 3:5",
  ];

  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }

  function dayIndex() {
    // Days since epoch — stable for the whole calendar day, changes at midnight.
    var now = new Date();
    var days = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
    var n = NOTES.length;
    // Golden-ratio step that's coprime to n → a full-cycle rotation that visits
    // every note exactly once before repeating, jumps ~0.62·n each day (so it
    // reads shuffled, never sequential), and can never repeat two days running.
    var step = Math.floor(n * 0.618) || 1;
    while (step > 1 && gcd(step, n) !== 1) step--;
    return ((days * step) % n + n) % n;
  }

  try {
    var root = document.getElementById('autumn-daily-note');
    if (!root) return;
    var d = new Date();
    var opts = { month: 'long', day: 'numeric', year: 'numeric' };
    root.querySelector('.adn-date').textContent = d.toLocaleDateString(undefined, opts);
    root.querySelector('.adn-body').textContent = NOTES[dayIndex()];
  } catch (e) { /* never break the page over a note */ }
})();
</script>
