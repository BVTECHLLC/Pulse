<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ app_name }} — Sign in</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/pulse.css?v={{ version }}">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a class="lockup" href="/">
      <img src="/static/img/mark.svg" alt="BVTech OpsPilot">
      <span class="wm"><b>BVTech</b> OpsPilot<span>MSP Command Center</span></span>
    </a>
    <h1>Sign in</h1>
    <p class="sub">Command center &amp; client portal</p>

    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@bvtech.org">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <div id="mfa-row" class="hidden">
      <label>Authenticator code</label>
      <input id="mfa" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" style="width:100%;margin-top:18px" onclick="doLogin()">Sign in</button>
    <div id="sso" class="hidden" style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:6px 0">
        <span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <div id="sso-btns" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="auth-links">New here? <a href="/signup">Request access →</a></div>
    <div class="foot">v{{ version }} · Encrypted · MFA-ready · Audit-logged</div>
  </div>
</div>
<script>
// Single sign-on buttons appear only for configured providers.
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('oauth_error')){
    const m={no_account:'That Microsoft/Google account isn’t linked to a Pulse login yet. Sign in with your work M365 email, or ask your MSP to invite that address.',
      sso_disabled:'SSO is disabled.',
      exchange_failed:'Sign-in failed — please try again.',no_token:'Sign-in failed — please try again.'};
    setTimeout(()=>{const e=document.getElementById('err');if(e)e.textContent=m[params.get('oauth_error')]||'Sign-in failed.';},50);
  }
  fetch('/api/oauth/providers').then(r=>r.ok?r.json():{providers:[]}).then(j=>{
    if(!j.sso_allowed||!(j.providers||[]).length)return;
    document.getElementById('sso').classList.remove('hidden');
    document.getElementById('sso-btns').innerHTML=(j.providers||[]).map(p=>
      `<a class="btn ghost" style="width:100%;text-align:center;text-decoration:none" href="/api/oauth/${p.key}/login">Sign in with ${p.name}</a>`).join('');
  }).catch(()=>{});
})();
async function doLogin(){
  const err=document.getElementById('err');err.textContent='';
  const body={
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value,
    mfa_code:document.getElementById('mfa').value.trim()||null
  };
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){
    const d=await r.json();
    location.href = (d.role==='client_admin'||d.role==='client_viewer') ? '/portal' : '/dashboard';
    return;
  }
  const d=await r.json().catch(()=>({detail:'Error'}));
  if(d.detail==='MFA code required'){
    document.getElementById('mfa-row').classList.remove('hidden');
    err.textContent='Enter your authenticator code.';
  }else{
    err.textContent=d.detail||'Sign in failed';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
<script src="/static/js/brand.js?v={{ version }}"></script>
</body>
</html>
