# BVTech OpsPilot — production compose
# Reverse proxy: Caddy (auto HTTPS) OR Cloudflare Tunnel (recommended; see docs).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--save","60","1","--appendonly","no"]
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # No host port published — Caddy (or cloudflared) reaches it on the internal network.
    expose:
      - "8000"

  # Signal 199X — the self-hosted Node game (v1.104). Pure-stdlib Node 24
  # (node:sqlite), source mounted read-only, SQLite in a writable volume. Not
  # publicly exposed: the portal reverse-proxies it at /signal/ (see
  # app/api/routes/game_proxy.py), so no extra DNS/TLS/tunnel is needed.
  game:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /game
    command: ["node", "server.mjs"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "true"
      ALLOWED_ORIGINS: "https://portal.bvtech.org"
      DATA_DIR: /data
    volumes:
      - ./games/signal199x:/game:ro
      - gamedata:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  gamedata:
