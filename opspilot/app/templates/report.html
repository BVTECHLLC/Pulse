<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Report — {{ app_name }}</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/pulse.css">
<style>
  @media print{.noprint{display:none}body{background:#fff}}
  .rep{max-width:920px;margin:24px auto;padding:0 16px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .big{font-size:30px;font-weight:800}
</style>
</head>
<body>
<div class="rep">
  <div class="noprint flex" style="justify-content:space-between;margin-bottom:12px">
    <a class="lockup" href="/dashboard"><img src="/static/img/mark.svg"><span class="wm"><b>BVTech</b> OpsPilot</span></a>
    <div class="flex"><button class="btn sm" onclick="window.print()">Print / Save PDF</button>
      <button class="btn sm" onclick="genNarrative()">✨ QBR narrative</button>
      <a class="btn sm ghost" id="csv-link" href="#">Export CSV</a>
      <a class="btn sm ghost" href="/dashboard">Back</a></div>
  </div>
  <div class="card hidden" id="narrative" style="margin-bottom:12px"></div>
  <div class="card" id="rep">Loading…</div>
  <div class="brand-footer"><span>© BVTech LLC · El Campo, TX</span>
    <span class="scripture">"Whatever you do, work heartily." — Col 3:23</span></div>
</div>
<script>
const CID={{ client_id }};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function money(v){return '$'+(v||0).toLocaleString(undefined,{maximumFractionDigits:0});}
function scoreColor(v){return v>=85?'var(--ok)':(v>=60?'var(--warn)':'var(--bad)');}
function kpi(label,val,sub,color){return `<div class="card"><h3>${label}</h3><div class="big" style="color:${color||'var(--ink)'}">${val}</div><div class="muted">${sub||''}</div></div>`;}
async function genNarrative(){
  const box=document.getElementById('narrative'); box.classList.remove('hidden');
  box.innerHTML='<p class="muted">✨ Claude is writing your executive summary…</p>';
  try{
    const r=await fetch(`/api/reports/${CID}/narrative`,{method:'POST',headers:{'Content-Type':'application/json'}});
    const j=await r.json().catch(()=>({}));
    box.innerHTML=r.ok
      ? `<h3 style="margin-top:0">Executive Summary</h3><div style="white-space:pre-wrap;line-height:1.5">${esc(j.narrative)}</div>`
      : `<p class="err">${esc(j.detail||'Could not generate — connect Claude on the server.')}</p>`;
  }catch(e){ box.innerHTML='<p class="err">Something went wrong reaching Claude.</p>'; }
}
async function load(){
  const r=await fetch(`/api/reports/${CID}/summary`);
  if(r.status===401){location.href='/';return;}
  if(!r.ok){document.getElementById('rep').textContent='Report unavailable.';return;}
  const d=await r.json();
  const csv=document.getElementById('csv-link'); if(csv)csv.href=`/api/reports/${CID}/export.csv`;
  const sec=d.security||{}, al=d.alerts||{}, dv=d.devices||{}, tk=d.tickets||{}, rev=d.revenue||{};
  const pa=d.patch||{}, pj=d.projects||{}, as=d.assets||{}, sv=d.service||{};
  document.getElementById('rep').innerHTML=`
    <div class="flex" style="justify-content:space-between;align-items:flex-start">
      <div><h2 style="margin:0">${esc(d.client.name)}</h2>
        <p class="muted" style="margin:4px 0">${esc(d.client.primary_contact||'')} ${d.client.email?'· '+esc(d.client.email):''}</p></div>
      <div class="right muted">Service Review<br>${new Date(d.generated_at).toLocaleDateString()}</div>
    </div>
    <div class="kpis" style="margin:18px 0">
      ${kpi('Security Score', sec.score!=null?sec.score:'—', (sec.open_findings||0)+' open findings', scoreColor(sec.score||0))}
      ${kpi('Avg Device Health', dv.avg_health!=null?dv.avg_health:'—', dv.total+' devices · '+dv.need_attention+' need attention', scoreColor(dv.avg_health||0))}
      ${kpi('Active Alerts', al.total||0, (al.critical||0)+' critical', (al.total?'var(--bad)':'var(--ok)'))}
      ${kpi('Monthly Spend', money(rev.mrr), money(rev.arr)+' / yr', 'var(--ink)')}
    </div>
    <div class="kpis" style="margin:0 0 18px">
      ${kpi('Patch Compliance', pa.compliance_pct!=null?pa.compliance_pct+'%':'—', (pa.pending_total||0)+' updates pending', scoreColor(pa.compliance_pct||0))}
      ${kpi('Tickets Resolved', tk.resolved||0, (tk.open||0)+' still open', 'var(--ink)')}
      ${kpi('Service Delivered', (sv.hours_90d||0)+'h', (sv.billable_hours_90d||0)+'h billable · 90d', 'var(--ink)')}
      ${kpi('Assets Tracked', as.total||0, (as.warranty_expiring||0)+' warranties expiring', (as.warranty_expiring?'var(--warn)':'var(--ink)'))}
    </div>
    <div class="grid cols-2">
      <div class="card"><h3>Support</h3>
        <p>Open tickets: <b>${tk.open||0}</b> of ${tk.total||0}</p>
        <p>Resolved: <b>${tk.resolved||0}</b></p>
        <p>SLA breached: <b style="color:${tk.sla_breached?'var(--bad)':'var(--ok)'}">${tk.sla_breached||0}</b></p></div>
      <div class="card"><h3>Projects</h3>
        <p>Active projects: <b>${pj.active||0}</b> of ${pj.total||0}</p>
        <p>Tasks completed: <b>${pj.tasks_done||0}</b> of ${pj.tasks_total||0}</p></div>
    </div>
    <div class="grid cols-2" style="margin-top:14px">
      <div class="card"><h3>Recurring Revenue</h3>
        <p>Contracts: ${money(rev.contract_mrr)}/mo (${rev.active_contracts||0} active)</p>
        <p>Licenses: ${money(rev.license_mrr)}/mo (${rev.licenses||0})</p>
        <p><b>Total MRR: ${money(rev.mrr)}</b> · ${money(rev.arr)}/yr</p></div>
      <div class="card"><h3>Infrastructure</h3>
        <p>Managed devices: <b>${dv.total||0}</b> (avg health ${dv.avg_health!=null?dv.avg_health:'—'})</p>
        <p>Patch compliance: <b>${pa.compliance_pct!=null?pa.compliance_pct+'%':'—'}</b></p>
        <p>Assets: <b>${as.total||0}</b> · ${as.warranty_expiring||0} warranties expiring (60d)</p></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Security Findings by Severity</h3>
      <p>Critical: <b style="color:var(--bad)">${(sec.by_severity||{}).critical||0}</b> ·
         High: <b>${(sec.by_severity||{}).high||0}</b> ·
         Medium: ${(sec.by_severity||{}).medium||0} ·
         Low: ${(sec.by_severity||{}).low||0}</p></div>
    <p class="muted" style="margin-top:16px;font-size:12px">Prepared by BVTech LLC for ${esc(d.client.name)}. Confidential.</p>`;
}
load();
</script>
</body>
</html>
