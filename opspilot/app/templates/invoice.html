<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice — {{ app_name }}</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/pulse.css?v={{ version }}">
<style>
  @media print{.noprint{display:none}body{background:#fff}.inv-card{box-shadow:none;border:none}}
  .inv-wrap{max-width:820px;margin:24px auto;padding:0 16px}
  .inv-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px}
  .inv-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px}
  .inv-total{font-size:28px;font-weight:800;color:var(--ink)}
  .right{text-align:right}
  .pay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .pay-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
  .pay-h{font-weight:700;margin-bottom:6px}
  .pay-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .pay-row b{text-align:right;word-break:break-word}
</style>
</head>
<body>
<div class="inv-wrap">
  <div class="noprint flex" style="justify-content:space-between;margin-bottom:12px">
    <a class="lockup" href="/dashboard"><img src="/static/img/mark.svg"><span class="wm"><b>BVTech</b> OpsPilot</span></a>
    <div class="flex"><button class="btn sm" onclick="window.print()">Print / Save PDF</button>
      <a class="btn sm ghost" href="/dashboard">Back</a></div>
  </div>
  <div class="inv-card" id="inv">Loading…</div>
</div>
<script>
const ID={{ invoice_id }};
function money(v,cur){return (cur||'USD')+' '+(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
async function load(){
  const r=await fetch(`/api/invoices/${ID}`);
  if(r.status===401){location.href='/';return;}
  if(!r.ok){document.getElementById('inv').textContent='Invoice not found.';return;}
  const i=await r.json();
  const rows=(i.line_items||[]).map(li=>
    `<tr><td>${esc(li.description)}</td><td class="right">${li.quantity}</td>
     <td class="right">${money(li.unit_price,i.currency)}</td><td class="right">${money(li.amount,i.currency)}</td></tr>`).join('');
  document.getElementById('inv').innerHTML=`
    <div class="inv-head">
      <div><div class="lockup"><img src="/static/img/mark.svg" style="width:40px;height:40px"><span class="wm"><b>BVTech</b> OpsPilot</span></div>
        <p class="muted" style="margin:10px 0 0">BVTech LLC · Sugar Land, TX · help@bvtech.org</p></div>
      <div class="right"><h2 style="margin:0">INVOICE</h2>
        <p class="muted" style="margin:4px 0">${esc(i.number||('#'+i.id))}</p>
        <span class="badge ${i.status==='paid'?'ok':(i.status==='void'?'bad':'warn')}">${esc(i.status)}</span></div>
    </div>
    <div class="flex" style="justify-content:space-between;margin:18px 0;color:var(--muted)">
      <div>Issued: ${i.issued_at?new Date(i.issued_at).toLocaleDateString():'—'}<br>
           Due: ${i.due_at?new Date(i.due_at).toLocaleDateString():'—'}</div>
      <div class="right">Period:<br>${i.period_start?new Date(i.period_start).toLocaleDateString():'—'} – ${i.period_end?new Date(i.period_end).toLocaleDateString():'—'}</div>
    </div>
    <table style="margin-top:8px"><thead><tr><th>Description</th><th class="right">Qty</th><th class="right">Unit</th><th class="right">Amount</th></tr></thead>
      <tbody>${rows||'<tr><td colspan=4 class="muted">No line items.</td></tr>'}</tbody></table>
    <div class="right" style="margin-top:18px">
      <div class="muted">Subtotal: ${money(i.subtotal,i.currency)}</div>
      <div class="muted">Tax (${i.tax_rate||0}%): ${money(i.tax_amount,i.currency)}</div>
      <div class="inv-total" style="margin-top:6px">Total: ${money(i.total,i.currency)}</div>
    </div>
    ${i.notes?`<p class="muted" style="margin-top:18px">${esc(i.notes)}</p>`:''}
    <div id="paybox"></div>`;
  loadPay(i);
}

async function loadPay(i){
  const box=document.getElementById('paybox'); if(!box) return;
  let p; try{ const r=await fetch(`/api/payments/invoices/${ID}/options`); if(!r.ok) return; p=await r.json(); }catch(e){ return; }
  if(p.paid){ box.innerHTML=`<div class="noprint" style="margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(34,197,94,.08)"><b>✓ Paid in full.</b> Thank you!</div>`; return; }
  const balLine=(p.amount_paid>0)?`<p class="muted" style="margin:0 0 10px">Paid ${money(p.amount_paid,p.currency)} of ${money(p.total,p.currency)} · <b>Balance due ${money(p.balance,p.currency)}</b></p>`:'';
  const cards=[];
  if(p.stripe){
    cards.push(`<div class="pay-card"><div class="pay-h">💳 Pay by Card</div>
      <p class="muted" style="margin:4px 0 10px;font-size:13px">Secure online checkout — Visa, Mastercard, Amex.</p>
      <button class="btn" id="pay-stripe" onclick="payStripe(this)">Pay ${money(p.balance!=null?p.balance:p.total,p.currency)} now</button></div>`);
  }
  (p.options||[]).forEach(o=>{
    let body='';
    if(o.kind==='link'){
      body=`<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(o.url)}">${esc(o.button||('Pay with '+o.label))}</a>`;
    }else{
      const rows=(o.instructions||[]).map(x=>`<div class="pay-row"><span class="muted">${esc(x.label)}</span><b>${esc(x.value)}</b></div>`).join('');
      body=`${rows}${o.note?`<p class="muted" style="margin:8px 0 0;font-size:12px">${esc(o.note)}</p>`:''}`;
    }
    cards.push(`<div class="pay-card"><div class="pay-h">${esc(o.emoji||'•')} ${esc(o.label)}</div>${body}</div>`);
  });
  if(!cards.length){ return; }
  box.innerHTML=`<div class="noprint" style="margin-top:24px">
    <h3 style="margin:0 0 4px">Pay this invoice</h3>
    ${balLine}
    ${p.note?`<p class="muted" style="margin:0 0 12px;font-size:13px">${esc(p.note)}</p>`:''}
    <div class="pay-grid">${cards.join('')}</div></div>`;
}

async function payStripe(btn){
  btn.disabled=true; const old=btn.textContent; btn.textContent='Redirecting…';
  try{
    const r=await fetch(`/api/payments/invoices/${ID}/checkout`,{method:'POST',headers:{'Content-Type':'application/json'}});
    const j=await r.json().catch(()=>({}));
    if(j.url){ location.href=j.url; return; }
    alert(j.detail||'Could not start card checkout.');
  }catch(e){ alert('Could not start card checkout.'); }
  btn.disabled=false; btn.textContent=old;
}
load();
</script>
</body>
</html>
