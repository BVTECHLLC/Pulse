<!--
  Daily Note to Autumn — a self-updating "miss you" note for autumnpolasek.com.

  HOW IT WORKS: this is a drop-in widget. Paste the <div> + <script> below into
  the memorial page (anywhere in the <body> where you want the note to appear).
  It picks a different note every day, seeded by the calendar date — no server,
  no cron, no deploy. It just quietly changes on its own, forever. If Pulse or
  the box are ever down, this keeps working; it lives entirely in the page.

  Written by Jordan Polasek, for Autumn. 🐾
-->
<div id="autumn-daily-note" aria-live="polite">
  <div class="adn-card">
    <div class="adn-eyebrow">A note to Autumn — <span class="adn-date"></span></div>
    <p class="adn-body"></p>
    <div class="adn-sign">— Daddy misses you, sweet girl 🤎</div>
  </div>
</div>

<style>
  #autumn-daily-note{max-width:640px;margin:2.5rem auto;padding:0 1rem;
    font-family:Georgia,'Times New Roman',serif}
  #autumn-daily-note .adn-card{background:linear-gradient(180deg,#fbf7f1,#f4ece1);
    border:1px solid #e6d9c6;border-radius:18px;padding:1.6rem 1.5rem;
    box-shadow:0 8px 26px rgba(120,90,60,.12);text-align:center}
  #autumn-daily-note .adn-eyebrow{font-size:.8rem;letter-spacing:.06em;
    text-transform:uppercase;color:#a9865f;margin-bottom:.7rem}
  #autumn-daily-note .adn-body{font-size:1.18rem;line-height:1.7;color:#4b3b2c;
    margin:0 0 1rem;font-style:italic}
  #autumn-daily-note .adn-sign{font-size:1rem;color:#7b6350}
  @media (prefers-color-scheme:dark){
    #autumn-daily-note .adn-card{background:linear-gradient(180deg,#2a241f,#211c18);
      border-color:#3d342b;box-shadow:0 8px 26px rgba(0,0,0,.4)}
    #autumn-daily-note .adn-body{color:#eaddcb}
    #autumn-daily-note .adn-eyebrow{color:#caa578}
    #autumn-daily-note .adn-sign{color:#c9b49d}
  }
</style>

<script>
(function () {
  // 60 notes — with a date seed this cycles about every two months, so the same
  // note never lands two days running. Written by Jordan Polasek, to Autumn.
  var NOTES = [
    "Another morning without you, and the house is still too quiet where your tail used to thump against the floor. I miss you every single day.",
    "I still catch myself listening for your paws on the hardwood. Some habits love doesn’t let go of. I love you, girl.",
    "You made even the ordinary days feel like something. I’d give anything for one more ordinary day with you.",
    "The spot by the window is still yours. It always will be. Miss you, sweet Autumn.",
    "I hope wherever you are, the grass is soft, the sun is warm, and someone’s throwing the ball just the way you liked.",
    "Every good thing I do today, I’m doing it a little bit for you too. You made me better just by being here.",
    "I keep a picture of you close. On the hard days it’s the first thing that makes me smile. Thank you for that, even now.",
    "You never needed words to tell me it was going to be okay. I could use that look of yours today, girl.",
    "The goofy way you tilted your head — I’d trade a lot to see it one more time. Miss you more than I can say.",
    "You were the best part of coming home. The door still feels a little heavier without you behind it.",
    "I planted something in the yard where you loved to lie in the sun. A little life, growing in your spot. That’s for you.",
    "Grief is just love with nowhere to go. So I’m sending it up to you today. Rest easy, sweet girl.",
    "You taught me patience, loyalty, and how to be happy over the small stuff. I’m still learning from you.",
    "Some nights I swear I feel you curl up at the foot of the bed. I hope that’s you saying hello.",
    "There’s a kind of quiet that only your presence could fill. I’m sitting in it today and missing you fiercely.",
    "You loved me on my worst days like they were my best. I hope you knew you were loved the same way.",
    "The world lost a lot of joy the day it lost you. But I got to keep all the joy you gave me. Thank you, Autumn.",
    "I’d walk that trail with you a thousand more times if I could — you leading, me laughing, both of us in no hurry.",
    "You were only a dog to people who never met you. To me you were family, and family you’ll stay.",
    "Every sunrise I get, I think of yours. You greeted each one like it was a gift. I’m trying to do the same, for you.",
    "The house is clean of fur now and I hate it. I’d take the mess back in a heartbeat if it meant taking you back too.",
    "You had a way of leaning your whole weight against me when I needed it most. I’m leaning on the memory of that today.",
    "I hope there are puddles to splash in and squirrels that let you win once in a while. You earned that, girl.",
    "Loving you was the easiest thing I’ve ever done. Missing you is the hardest. Both are worth it.",
    "I still say goodnight to you. Old habits, good habits. Sleep well, my sweet Autumn.",
    "You made a home out of wherever I was. I’m still learning how to make one without you in it.",
    "Thank you for every tail wag, every warm sigh, every time you chose to be near me. It was everything.",
    "There are days the missing sneaks up on me — a song, a smell, an empty leash by the door. Today’s one of those. I love you.",
    "You never held a grudge, never stayed mad, never gave up on me. Be a little bit more like Autumn — that’s my goal today.",
    "The ball’s still in the yard. I can’t bring myself to move it. It’s yours. It’s always yours.",
    "I hope you’ve made friends up there, and that they know how lucky they are to run beside you.",
    "You were with me through seasons of my life that no one else saw. You carried more of me than you’ll ever know. Thank you, girl.",
    "Some love doesn’t end, it just changes address. Yours moved into my heart for good. Miss you, Autumn.",
    "I’d give up a lot of tomorrows for one more of your yesterdays. But I’m grateful for every one I got.",
    "You made being still feel like enough. I’m trying to remember that on the busy days. That one’s from you.",
    "The vet, the drives, the waiting rooms — you were brave through all of it. Braver than me. I’m so proud of you.",
    "I hope the last thing you felt was how deeply you were loved. Because you were. You are. You always will be.",
    "Your name still lives in this house, in this yard, in me. Nothing’s taking that. Miss you, sweet girl.",
    "You didn’t just fill a room, you warmed it. Everywhere feels a few degrees colder now. I love you.",
    "I found one of your favorite toys today. Sat with it a while. Talked to you a little. I think you heard me.",
    "If loyalty had a shape, it’d have four paws and a goofy grin and it’d look exactly like you.",
    "The mornings are when I miss you most — that was our time. I’m keeping the ritual, even solo. For you.",
    "You never asked for much. A walk, a meal, a hand on your head. I’d give it all again, tenfold, in a heartbeat.",
    "Thank you for choosing me, girl. Out of all the people in all the world, you spent your whole life loving me.",
    "There’s a Autumn-shaped space in every day that nothing else fits into. I’ve stopped trying to fill it. It’s yours.",
    "I hope you’re running full-speed with your ears back and not a care in the world. That’s how I picture you. That’s my peace.",
    "You were the good in a lot of my hard days. I hope I was even half the good in yours.",
    "Rain on the window makes me think of you curled up safe inside with me. Safe and warm and mine. Miss you.",
    "I still reach down to pet you sometimes before I remember. My hand knows what my head is still learning.",
    "You gave me years of the purest company I’ve ever known. No conditions, no distance, just love. Thank you, Autumn.",
    "Whatever heaven is, I hope it’s got a sunny porch and a screen door that’s always open for you.",
    "I’m carrying you with me today — into every room, down every road. You’re not behind me, you’re beside me.",
    "The quiet still surprises me. Then I remember, and I let myself miss you. It’s okay. Love’s supposed to leave a mark.",
    "You were a very good girl. The best girl. I hope you heard me say it enough. I’ll keep saying it anyway.",
    "One day I’ll see that goofy grin come bounding toward me again. Until then, I’ll hold the line, girl. Wait for me.",
    "I’m grateful for the vet team who loved you gently at the end, and for every ordinary day we got before it. Miss you, Autumn.",
    "You turned a house into our home and a man into someone worth your love. I’m still trying to live up to it.",
    "Some days I talk to you out loud. Feels less crazy than pretending you’re not still listening. Hey, girl. I miss you.",
    "The sun came up again today, sweet Autumn. I thought of you the moment it did. I always will.",
    "There’s no bottom to how much I miss you, and no end to how grateful I am you were mine. Rest easy, my girl."
  ];

  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }

  function dayIndex() {
    // Days since epoch — stable for the whole calendar day, changes at midnight.
    var now = new Date();
    var days = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
    var n = NOTES.length;
    // Golden-ratio step that's coprime to n → a full-cycle rotation that visits
    // every note exactly once before repeating, jumps ~0.62·n each day (so it
    // reads shuffled, never sequential), and can never repeat two days running.
    var step = Math.floor(n * 0.618) || 1;
    while (step > 1 && gcd(step, n) !== 1) step--;
    return ((days * step) % n + n) % n;
  }

  try {
    var root = document.getElementById('autumn-daily-note');
    if (!root) return;
    var d = new Date();
    var opts = { month: 'long', day: 'numeric', year: 'numeric' };
    root.querySelector('.adn-date').textContent = d.toLocaleDateString(undefined, opts);
    root.querySelector('.adn-body').textContent = NOTES[dayIndex()];
  } catch (e) { /* never break the page over a note */ }
})();
</script>
