# BVTech OpsPilot — production compose
# Reverse proxy: Caddy (auto HTTPS) OR Cloudflare Tunnel (recommended; see docs).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--save","60","1","--appendonly","no"]
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Serve the WASM games statically from the portal. The Dockerfile copies
    # only app/migrations/agent, so each game dir MUST be bind-mounted here or
    # it won't exist in the container. graveyard-3d is the live Godot build;
    # graveyard-web is the archived macroquad arcade build (fallback).
    volumes:
      - ./games/arena-web:/app/games/arena-web:ro
      - ./games/graveyard-web:/app/games/graveyard-web:ro
      - ./games/graveyard-3d:/app/games/graveyard-3d:ro
      - ./games/graveyard-shift-beta:/app/games/graveyard-shift-beta:ro
      - ./games/volt-rush/dist:/app/games/volt-rush/dist:ro
    # No host port published — Caddy (or cloudflared) reaches it on the internal network.
    expose:
      - "8000"

  # VOLT RUSH — authoritative Node/ws race server for the /kart multiplayer kart
  # racer. Internal-only: the api service serves the static client and proxies
  # /kart/ws to this container. NOT started by the api-only auto-deploy — bring it
  # up (and after future updates) with:  docker compose up -d --build volt-rush
  volt-rush:
    build: ./games/volt-rush
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3108"
      # Reachable only via the portal's internal proxy, so the server's public
      # same-origin Origin check (for direct exposure) is turned off here.
      ALLOW_CROSS_ORIGIN: "true"
    expose:
      - "3108"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
